/**:
  ros__parameters:
    motor_sound:
      enabled: true

      # Which costume the acceleration wears. "motor" is the electric whine
      # modelled in motor_synth; the rest live in accel_voices and are pure
      # character. Switchable live:
      #   ros2 param set /motor_sound motor_sound.voice purr
      # motor | lip_trill | mars_voice | whistle | music_box | chiptune |
      # purr | hyperdrive | choir
      voice: "motor"

      volume: 0.50                # 0..1, before the ALSA softvol Master level
      idle_when_stopped: true     # keep the motor rumbling while parked (in Mad mode)
      # The engine only runs in Mad mode: the node watches /robot/info's
      # drive_speed_scale and plays its spin-up chirp on entry. Set false to
      # run it in every mode.
      only_in_mad_mode: true

      # Pitch. Within each gear the whine sweeps base_hz to top_hz; the ratio
      # between them is the size of the sweep per gear (2.5x, ~16 semitones).
      # Kept in the low register: at 450 the partial stack tops out near
      # 3.3 kHz, where 950 pushed it to ~7 kHz and read as shriek.
      base_hz: 180.0
      top_hz: 450.0

      # Gearbox: fraction of max_speed where each gear tops out. A single
      # gear means one slow sweep across the whole speed range with no
      # snap-backs; shift_seconds only matters with two or more entries.
      gear_tops: [1.00]
      shift_seconds: 0.12

      # Drive model. Mad mode doubles the motion_control cap (0.4 * 2.0), so
      # top gear redlines at Mad's actual top speed, not the nominal cap.
      max_speed: 0.80
      reference_acceleration: 0.60  # commanded m/s^2 that counts as full throttle

      # The motor's own speed chases the robot's through a damped spring, so
      # pulling away swoops and stopping glides down. spring_hz sets how
      # eagerly it chases: 1.2 makes the heard acceleration deliberately lag
      # the real one, a slow spool-up rather than exact tracking. damping
      # below 1 is what produces the overshoot (0.55 peaks at ~112% of
      # target); at 1.0 it tracks speed exactly and sounds mechanical.
      spring_hz: 1.2
      damping: 0.55

      # Texture. wobble_* is vibrato (0.018 is about a third of a semitone);
      # brush_depth is commutator-flutter tremolo -- 0 is a clean brushless
      # hum, higher is brushier and tremblier.
      wobble_hz: 5.5
      wobble_depth: 0.018
      brush_depth: 0.35

      # Acceleration growl: a slow irregular throb plus low-mid strain noise,
      # both scaled by load -- flooring it rumbles, cruising is smooth.
      growl_hz: 26.0
      growl_depth: 0.50
      growl_noise_level: 0.20

      # High-rev snarl: past snarl_start (fraction of the speed range) the
      # stack brightens, a sub-octave undertone and the growl throb fade in,
      # and the saturator is driven into grit -- redline roars with low-end
      # power instead of sitting sterile at its final pitch. depth 0 disables.
      snarl_start: 0.55
      snarl_depth: 1.0

      rolling_level: 0.14         # bearing and wheel noise, scaled by speed

      # Tire screech on hard turns. Swells in once commanded yaw passes
      # screech_min_turn (a fraction of max_yaw_rate) and peaks at
      # max_yaw_rate; screech_level 0 removes it entirely.
      screech_level: 0.40
      screech_hz: 800.0           # squeal fundamental, low end of the real 0.7-1.3 kHz range
      max_yaw_rate: 2.0           # rad/s counting as cornering flat out (Mad's turn cap)
      screech_min_turn: 0.40

      startup_seconds: 0.9        # spin-up chirp on entering Mad mode
      idle_level: 0.12            # how loud it sits when stopped but enabled

      # Audio device. 48 kHz and the default device match config/alsa/asound.conf.
      sample_rate: 48000
      blocksize: 512              # ~11 ms of latency
      device: ""                  # empty = ALSA default (dmix, shared with TTS)
