/**:
  ros__parameters:
    use_sim_time: false
    # 10 Hz: 20 Hz MPPI was not achievable on this CPU (constant "Control loop
    # missed its desired rate" spam), and every overrun past the velocity
    # smoother's timeout zeroed cmd_vel -> stop-start stutter.
    controller_frequency: 10.0
    # Tolerate brief controller hiccups instead of aborting the whole goal on
    # the first missed cycle (seconds; 0.0 = abort immediately).
    failure_tolerance: 1.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5         # Differential drive: no lateral motion
    min_theta_velocity_threshold: 0.001
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker", "goal_checker_precise"]
    controller_plugins: ["InnateFollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    goal_checker:
      plugin: "mars_nav::DynamicGoalChecker"
      time_thresholds: [0.0, 0.40]
      xy_tolerances: [0.25, 0.10]
      yaw_tolerances: [0.16, 0.10] # 10 deg -> tighter final settle
      linear_vel_tolerances: [0.5, 0.08]
      angular_vel_tolerances: [1.5, 0.25]
    goal_checker_precise:
      plugin: "mars_nav::DynamicGoalChecker"
      time_thresholds: [0.0, 0.30]
      xy_tolerances: [0.15, 0.08]
      yaw_tolerances: [0.12, 0.08] # 5 deg -> tighter final settle
      linear_vel_tolerances: [0.5, 0.06]
      angular_vel_tolerances: [1.5, 0.20]
    # MPPI controller parameters for the "FollowPath" plugin
    InnateFollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      
      # Motion model and basic parameters
      motion_model: "DiffDrive"
      time_steps: 25                    # 25 steps * 0.1s = same 2.5s prediction horizon at half the compute
      model_dt: 0.1                     # 1/controller_frequency = 1/10 = 0.1s
      batch_size: 1500                  # Number of trajectory samples
      iteration_count: 1

      # Velocity limits (from existing DWB config)
      vx_min: -0.2                      # matches min_vel_x
      vx_max: 0.4                       # bringup hard-clamps at safety.max_speed 0.4 — commanding above it
                                        # makes MPPI's model assume speed the motors never deliver
      vy_max: 0.0                       # differential drive - no lateral motion
      wz_max: 0.6                       # matches velocity_smoother max
      
      # Acceleration limits
      ax_min: -0.3                      # decel limit for linear x
      ax_max: 0.3                       # accel limit for linear x
      ay_min: 0.0                       # differential drive - no lateral acceleration
      ay_max: 0.0                       # differential drive - no lateral acceleration
      az_max: 0.5                       # angular acceleration limit
      
      # Sampling standard deviations
      vx_std: 0.2                       # Forward velocity sampling std
      vy_std: 0.0                       # No lateral sampling for diff drive
      wz_std: 0.2                       # Angular velocity sampling std (matched to vx_std)
      
      # Path handling
      transform_tolerance: 0.2          # matches existing transform_tolerance
      prune_distance: 1.5               # Distance ahead to prune path
      max_robot_pose_search_dist: 10.0  # Max distance to search for nearest path point
      
      # Algorithm parameters
      temperature: 0.3                  # Trajectory selection temperature
      gamma: 0.015                      # Smoothness vs energy trade-off
      visualize: false                    # Set to true for debugging (slows performance)
      regenerate_noises: false
      
      # Goal tolerances
      xy_goal_tolerance: 0.25           # matches existing xy_goal_tolerance
      
      # Critics (objective functions)
      critics: [
        "ConstraintCritic", 
        "CostCritic", 
        "GoalCritic", 
        "GoalAngleCritic", 
        "PathAlignCritic", 
        "PathFollowCritic", 
        "PathAngleCritic", 
        "PreferForwardCritic"
      ]
      
      # Constraint critic - ensures trajectories stay within kinematic limits
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      
      # Cost critic - uses costmap for obstacle avoidance
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.8
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 0.5
        trajectory_point_step: 2
      
      # Goal critic - drives robot toward goal position
      GoalCritic:
        enabled: true
        cost_power: 2
        cost_weight: 15.0
        threshold_to_consider: 0.6
      
      # Goal angle critic - aligns robot with goal orientation
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0
        threshold_to_consider: 0.3
      
      # Path alignment critic - keeps robot aligned with path
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.6
        offset_from_furthest: 20
        use_path_orientations: false
      
      # Path following critic - drives progress along path
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 6
        threshold_to_consider: 0.6
      
      # Path angle critic - handles sharp turns
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 1.0
        offset_from_furthest: 4
        threshold_to_consider: 0.6
        max_angle_to_furthest: 1.0
        mode: 0                          # Forward preference mode
      
      # Prefer forward critic - encourages forward motion over reversing
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 15.0
        threshold_to_consider: 0.5
