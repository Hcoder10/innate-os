behavior_server:
  ros__parameters:
    use_sim_time: false
    # Humble's behavior_server reads `costmap_topic`/`footprint_topic` (defaults
    # local_costmap/costmap_raw + published_footprint, which are correct here).
    # The Jazzy-era local_/global_costmap_topic, *_footprint_topic,
    # transform_timeout and enable_stamped_cmd_vel params were removed: the
    # installed binary never declared them.
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin" # In Iron and older versions, "/" was used instead of "::"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading" # In Iron and older versions, "/" was used instead of "::"
    wait:
      plugin: "nav2_behaviors/Wait" # In Iron and older versions, "/" was used instead of "::"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop" # In Iron and older versions, "/" was used instead of "::"
    local_frame: odom
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    # Collision-check this far ahead during BackUp/DriveOnHeading. 0.0 made
    # recovery back-ups reverse completely blind (0.2 m rear overhang, no rear
    # sensor); this is the one global param the binary does honor.
    simulate_ahead_time: 1.5
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2
