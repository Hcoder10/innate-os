/**:
  planner_server:
    ros__parameters:
      expected_planner_frequency: 20.0
      planner_plugins: ['GridBased']
      use_sim_time: false

      GridBased:
        # NavFn instead of SmacPlanner2D: NavFn clears the robot's start cell
        # before planning, so an AMCL pose that drifts into an inflated
        # obstacle degrades gracefully instead of aborting instantly with
        # "Starting point in lethal space" (Smac2D has no start tolerance).
        plugin: "nav2_navfn_planner/NavfnPlanner"
        tolerance: 0.25
        # Unknown cells are traversable at high cost; with speckled or partial
        # maps a hard 'false' rejects plans through perfectly driveable space.
        allow_unknown: true
        use_astar: false
        use_final_approach_orientation: false
