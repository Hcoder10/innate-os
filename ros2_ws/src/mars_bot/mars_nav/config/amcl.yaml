# NOTE: the AMCL node is renamed to `navigation_amcl` in navigation.launch.py.
# Param files match by NODE NAME, so this file MUST be keyed `navigation_amcl`
# (a previous top-level `amcl:` key matched nothing and every value below was
# silently ignored — AMCL ran on Nav2 defaults).
/**:
  navigation_amcl:
    ros__parameters:
      use_sim_time: false
      alpha1: 0.4
      alpha2: 0.3
      alpha3: 0.4
      alpha4: 0.3
      alpha5: 0.3
      base_frame_id: "base_footprint"
      beam_skip_distance: 0.5
      beam_skip_error_threshold: 0.9
      beam_skip_threshold: 0.3
      do_beamskip: false
      global_frame_id: "map"
      lambda_short: 0.1
      laser_likelihood_max_dist: 2.0
      laser_max_range: 12.0   # RPLidar max usable range
      laser_min_range: 0.2
      laser_model_type: "likelihood_field"
      max_beams: 60
      # 3000 particles is plenty for rooms this size and roughly halves the
      # filter CPU vs the old 6000 on an already saturated box.
      max_particles: 3000
      min_particles: 500
      odom_frame_id: "odom"
      pf_err: 0.05
      pf_z: 0.99
      recovery_alpha_fast: 0.2
      recovery_alpha_slow: 0.005
      # Only update/resample after real motion. 0.0/0.0 with resample_interval 1
      # would update AND resample on every scan -> particle depletion +
      # overconvergence (and needless CPU) while standing still.
      resample_interval: 2
      update_min_a: 0.2
      update_min_d: 0.15
      robot_model_type: "nav2_amcl::DifferentialMotionModel"
      save_pose_rate: 0.5
      sigma_hit: 0.2
      tf_broadcast: true
      transform_tolerance: 1.0
      z_hit: 0.5
      z_max: 0.05
      z_rand: 0.5
      z_short: 0.05
      scan_topic: /scan
      map_topic: /map
      set_initial_pose: false
      always_reset_initial_pose: true # if lifecycle resets, assume any previous info is invalid
      first_map_only: false
