# Pre-commit hooks for innate-os.
#
# These are the same checks CI enforces (.github/workflows/format.yml runs
# `pre-commit run --all-files -c .config/pre-commit-config.yaml`), so violations
# are caught locally before they reach a PR. Hook versions are pinned here, so
# local and CI results are identical regardless of any system-installed tools.
#
# This config lives outside the repo root to keep the root tidy, so every
# pre-commit invocation must point at it with `-c .config/pre-commit-config.yaml`.
#
# One-time setup:
#   pip install pre-commit
#   pre-commit install -c .config/pre-commit-config.yaml   # run on `git commit`
# Run manually across the whole repo:
#   pre-commit run --all-files -c .config/pre-commit-config.yaml
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.15
    hooks:
      # Lint (auto-fixes what it safely can, then fails so you re-stage).
      - id: ruff
        args: [--fix]
      # Format.
      - id: ruff-format

  # C++ formatting. The mirror installs clang-format from pip at this pinned
  # version, so every contributor (and CI) uses the exact same formatter,
  # independent of any system clang-format.
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v18.1.3
    hooks:
      - id: clang-format
        # C/C++ only. The hook otherwise also targets json/js/java, which the
        # C++-only .clang-format can't format.
        types_or: [c, c++]

  # Locks the nav2 motion-limit remap to the real config: a plugin/param rename
  # in controller.yaml / velocity_smoother.yaml / the sim params fails here instead
  # of silently turning the nav override into a no-op. (needs pyyaml — it imports
  # config_loader.) Runs in an isolated venv so it needs no ROS/colcon build.
  - repo: local
    hooks:
      - id: nav-remap-param-names
        name: nav2 motion-limit remap targets exist in config
        entry: python -m pytest tests/test_motion_limit_overrides.py -q
        language: python
        additional_dependencies: [pytest, pyyaml]
        pass_filenames: false
        always_run: true

  # Locks _SETTINGS_DOUBLE_KEYS to settings.yaml.template: a float tunable added to the
  # template without being guarded fails here instead of crashing a node at startup with
  # an opaque InvalidParameterTypeException. (needs pyyaml — it imports config_loader.)
  - repo: local
    hooks:
      - id: settings-double-keys
        name: settings.yaml double tunables are all guarded
        entry: python -m pytest tests/test_settings_double_keys.py -q
        language: python
        additional_dependencies: [pytest, pyyaml]
        pass_filenames: false
        always_run: true

  # The launcher is a flat module set imported by bare name, so a symbol deleted
  # in config.py breaks its importers with nothing to notice. The image tests
  # alongside it hold the tags CI publishes equal to the ones it pulls.
  - repo: local
    hooks:
      - id: sim-launcher-and-images
        name: sim launcher imports; image tags match what CI publishes
        entry: >-
          python -m pytest -q
          tests/test_launcher_imports.py
          tests/test_assets_image_inputs.py
          tests/test_viewer_bundle_image.py
        language: python
        additional_dependencies: [pytest, pyyaml]
        pass_filenames: false
        always_run: true
