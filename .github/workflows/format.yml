name: Format Check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run pre-commit (ruff + clang-format)
        # Single source of truth: hooks and their versions are pinned in
        # .github/pre-commit-config.yaml, so CI and local `git commit` agree exactly.
        run: |
          pip install pre-commit
          pre-commit run --all-files --show-diff-on-failure -c .github/pre-commit-config.yaml
