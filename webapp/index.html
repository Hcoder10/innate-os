<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="color-scheme" content="dark" />
    <title>Innate</title>
    <!-- Absolute asset paths: this one shell is served for every app route
         (/, /agent, /profiling, …), so relative paths would resolve wrong. -->
    <link rel="icon" type="image/avif" href="/public/innate-logo.avif" />
    <link rel="stylesheet" href="/css/app.css" />
    <link rel="stylesheet" href="/css/calibration.css" />
  </head>
  <body>
    <main id="stage" class="stage"></main>
    <!-- Boot splash: painted on first paint (app.css is render-blocking), long
         before router.js and its module graph finish downloading and build the
         page. Without it the whole shell is black on a cold/slow load. router.js
         removes it once the first page has mounted. -->
    <div id="boot-splash" class="boot-splash">
      <div class="boot-splash__mark">loading</div>
      <div class="boot-splash__bar"><span></span></div>
    </div>
    <script type="module" src="/js/router.js"></script>
  </body>
</html>
